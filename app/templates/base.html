<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#4F46E5">
    <meta property="og:title" content="{{ app_name }}">
    <meta property="og:description" content="{{ app_tagline }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:image" content="{{ og_image }}">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <script>
    (function(){
        var ua = navigator.userAgent;
        var html = document.documentElement;
        // iOS: detect by OS version (all iOS browsers use the same WebKit)
        var ios = ua.match(/OS (\d+)_(\d+)/);
        if (ios && parseInt(ios[1]) < 15) {
            html.classList.add('safari14');
        }
        // Desktop Safari < 14.1 (no flex gap support)
        if (!ios) {
            var v = ua.match(/Version\/(\d+)\.(\d+)/);
            if (v && /Safari/.test(ua) && !/Chrome|CriOS/.test(ua)) {
                var major = parseInt(v[1]), minor = parseInt(v[2]);
                if (major < 14 || (major === 14 && minor === 0)) {
                    html.classList.add('safari14');
                }
            }
        }
    })()
    </script>
    <link rel="stylesheet" href="{{ app_prefix }}/static/css/tailwind.css">
    <script src="https://unpkg.com/lucide@0.472.0/dist/umd/lucide.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234F46E5'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif'%3E🏅%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="{{ app_prefix }}/manifest.json">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        input:focus { outline: none; }
        button svg, [data-lucide] { pointer-events: none; }
        .skeleton { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Flex gap fallback for Safari < 14.1 (e.g. iOS 14.4.2) */
        /* gap on flex containers is ignored → use margin-based spacing */
        .safari14 .flex.gap-1,
        .safari14 .inline-flex.gap-1 { gap: 0; }
        .safari14 .flex.gap-1 > * + *,
        .safari14 .inline-flex.gap-1 > * + * { margin-left: 0.25rem; }
        .safari14 .flex.gap-1\.5,
        .safari14 .inline-flex.gap-1\.5 { gap: 0; }
        .safari14 .flex.gap-1\.5 > * + *,
        .safari14 .inline-flex.gap-1\.5 > * + * { margin-left: 0.375rem; }
        .safari14 .flex.gap-2,
        .safari14 .inline-flex.gap-2 { gap: 0; }
        .safari14 .flex.gap-2 > * + *,
        .safari14 .inline-flex.gap-2 > * + * { margin-left: 0.5rem; }
        .safari14 .flex.gap-3,
        .safari14 .inline-flex.gap-3 { gap: 0; }
        .safari14 .flex.gap-3 > * + *,
        .safari14 .inline-flex.gap-3 > * + * { margin-left: 0.75rem; }

        /* Vertical flex direction: override horizontal margin, add vertical */
        .safari14 .flex-col.gap-1 > * + *,
        .safari14 .inline-flex.flex-col.gap-1 > * + * { margin-left: 0; margin-top: 0.25rem; }
        .safari14 .flex-col.gap-1\.5 > * + *,
        .safari14 .inline-flex.flex-col.gap-1\.5 > * + * { margin-left: 0; margin-top: 0.375rem; }
        .safari14 .flex-col.gap-2 > * + *,
        .safari14 .inline-flex.flex-col.gap-2 > * + * { margin-left: 0; margin-top: 0.5rem; }
        .safari14 .flex-col.gap-3 > * + *,
        .safari14 .inline-flex.flex-col.gap-3 > * + * { margin-left: 0; margin-top: 0.75rem; }

        /* Confirm dialog: use flex gap */
        .safari14 .confirm-box .confirm-btns { gap: 0; }
        .safari14 .confirm-box .confirm-btns > * + * { margin-left: 0.75rem; }

        /* Safari 14: CSS variables in transform are ignored → use direct values */
        .safari14 .translate-y-full { transform: translateY(100%); }
        .safari14 .translate-y-0 { transform: translateY(0); }
        .safari14 .-translate-y-1\/2 { transform: translateY(-50%); }
        .safari14 .active\:scale-\[0\.98\]:active { transform: scale(0.98); }
        .safari14 .group:active .group-active\:scale-95 { transform: scale(0.95); }

        /* Safari 14: inset shorthand not supported → expand to longhands */
        .safari14 .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .safari14 .inset-x-2 { left: 0.5rem; right: 0.5rem; }

        .toast {
            position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
            z-index: 9999; padding: 0.75rem 1.5rem; border-radius: 1rem;
            font-size: 0.875rem; font-weight: 600;
            animation: slideDown 0.3s ease;
        }
        .toast-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .toast-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-1rem); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* iOS picker */
        .ios-picker-wrapper {
            position: relative;
            height: 160px;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, transparent 5%, white 35%, white 65%, transparent 95%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, transparent 5%, white 35%, white 65%, transparent 95%, transparent);
        }
        .ios-picker-column {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .ios-picker-column::-webkit-scrollbar { display: none; }
        .ios-picker-item {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
        }

        /* Slide panel */
        .slide-panel { transition: transform 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94); transform: translateX(100%); }
        .slide-panel.active { transform: translateX(0); }

        /* Sub-modal bottom sheets */
        .custom-modal-mask { transition: opacity 0.25s ease; opacity: 0; pointer-events: none; }
        .custom-modal-mask.active { opacity: 1; pointer-events: auto; }
        .custom-modal-container { transition: transform 0.25s cubic-bezier(0.1, 0.76, 0.55, 0.94); transform: translateY(100%); }
        .custom-modal-mask.active .custom-modal-container { transform: none; }

        /* Confirm dialog */
        .confirm-overlay {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.4); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .confirm-overlay.active { opacity: 1; pointer-events: auto; }
        .confirm-box {
            background: white; border-radius: 1.25rem; padding: 1.5rem;
            width: calc(100% - 4rem); max-width: 320px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .confirm-box p { font-size: 0.938rem; color: #27272a; font-weight: 600; margin-bottom: 1.25rem; }
        .confirm-box .confirm-btns { display: flex; gap: 0.75rem; }
        .confirm-box .confirm-btns button {
            flex: 1; padding: 0.625rem; border-radius: 0.75rem;
            font-size: 0.875rem; font-weight: 600; border: none; cursor: pointer;
        }
        .confirm-box .btn-cancel { background: #f4f4f5; color: #71717a; }
        .confirm-box .btn-danger { background: #ef4444; color: white; }
    </style>
</head>
<body class="bg-zinc-100 min-h-screen font-sans antialiased">
    <!-- Safety net: force safari14 on iOS < 15 if head detection missed it -->
    <script>
    (function(){
        var ua = navigator.userAgent;
        var html = document.documentElement;
        var ios = ua.match(/OS (\d+)_(\d+)/);
        if (ios && parseInt(ios[1]) < 15 && !html.classList.contains('safari14')) {
            html.classList.add('safari14');
        }
    })();
    </script>
    {% block body %}{% endblock %}

    <div id="toast-container"></div>

    <script>
    window.APP_PREFIX = '{{ app_prefix }}';
    window.APP_NAME = '{{ app_name }}';
    window.APP_EMOJI = '{{ app_emoji }}';
    window.APP_TITLE = '{{ app_title }}';
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }
    function showToast(msg, type = 'error') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast toast-${type}`;
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, 2500);
        setTimeout(() => el.remove(), 2800);
    }
    </script>
    <script>
    // Disable service worker (clear old cache)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
                registration.unregister();
            }
        });
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
