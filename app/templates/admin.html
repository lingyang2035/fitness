{% extends "base.html" %}
{% block title %}管理后台 - 家庭健身{% endblock %}
{% block body %}
<div class="min-h-screen bg-slate-100">
    <div class="max-w-lg mx-auto p-4">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-xl font-black text-slate-800">⚙️ 管理后台</h1>
                <p class="text-xs text-slate-400" id="user-info"></p>
            </div>
            <a href="{{ app_prefix }}/app" class="text-sm text-orange-600 font-semibold hover:underline">← 返回应用</a>
        </div>

        <!-- Tabs -->
        <div class="bg-white p-1 rounded-2xl flex mb-4 shadow-sm">
            <button onclick="switchTab('dashboard')" id="tab-dashboard"
                    class="flex-1 py-2 rounded-xl text-xs font-semibold bg-orange-600 text-white transition-all">概览</button>
            <button onclick="switchTab('users')" id="tab-users"
                    class="flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500 transition-all">用户</button>
            <button onclick="switchTab('records')" id="tab-records"
                    class="flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500 transition-all">记录</button>
            <button onclick="switchTab('logs')" id="tab-logs"
                    class="flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500 transition-all">日志</button>
            <button onclick="switchTab('invites')" id="tab-invites"
                    class="flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500 transition-all">邀请</button>
        </div>

        <!-- Content Area -->
        <div id="content-area" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100"></div>
    </div>
</div>

<!-- User Edit Modal -->
<div id="user-modal" class="fixed inset-0 bg-black/40 z-50 flex items-end justify-center hidden">
    <div class="bg-white w-full max-w-lg rounded-t-[32px] p-6 max-h-[80vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-5">
            <h2 class="text-lg font-bold text-slate-800" id="user-modal-title">编辑用户</h2>
            <button onclick="closeUserModal()" class="p-1 hover:bg-slate-100 rounded-full">
                <i data-lucide="x"></i>
            </button>
        </div>
        <form id="user-form" onsubmit="submitUserForm(event)" class="space-y-4">
            <input type="hidden" id="edit-user-id">
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase mb-1 block">用户名</label>
                <input type="text" id="edit-username" required minlength="2"
                       class="w-full p-3 bg-slate-50 rounded-xl text-sm font-medium">
            </div>
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase mb-1 block">显示名称</label>
                <input type="text" id="edit-display-name" required
                       class="w-full p-3 bg-slate-50 rounded-xl text-sm font-medium">
            </div>
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase mb-1 block">密码 (留空不修改)</label>
                <input type="password" id="edit-password" minlength="4" placeholder="留空则不修改"
                       class="w-full p-3 bg-slate-50 rounded-xl text-sm font-medium">
            </div>
            <div>
                <label class="text-xs text-slate-400 font-semibold uppercase mb-1 block">角色</label>
                <select id="edit-role" class="w-full p-3 bg-slate-50 rounded-xl text-sm font-medium">
                    <option value="member">成员 (member)</option>
                    <option value="admin">管理员 (admin)</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <input type="checkbox" id="edit-active" checked class="w-4 h-4">
                <label for="edit-active" class="text-sm text-slate-600">账号激活</label>
            </div>
            <button type="submit" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold hover:bg-orange-700 transition-colors">
                保存
            </button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ app_prefix }}/static/js/api.js"></script>
<script src="{{ app_prefix }}/static/js/admin.js"></script>
{% endblock %}
