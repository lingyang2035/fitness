{% extends "base.html" %}
{% block title %}初始化 - {{ app_name }}{% endblock %}
{% block body %}
<div class="flex items-center justify-center min-h-screen p-6">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">{{ app_emoji }}</div>
            <h1 class="text-2xl font-black text-zinc-800 mb-2">欢迎加入{{ app_name }}</h1>
            <p class="text-zinc-400 text-sm">首次使用，请创建管理员账号</p>
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-zinc-100">
            <form id="setup-form" onsubmit="handleSetup(event)">
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-zinc-400 font-semibold uppercase mb-1 block">用户名</label>
                        <input type="text" id="username" required minlength="2" placeholder="登录用"
                               class="w-full p-3 bg-zinc-50 rounded-xl text-sm font-medium">
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 font-semibold uppercase mb-1 block">显示名称</label>
                        <input type="text" id="display_name" required placeholder="如：爸爸、妈妈"
                               class="w-full p-3 bg-zinc-50 rounded-xl text-sm font-medium">
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 font-semibold uppercase mb-1 block">密码</label>
                        <input type="password" id="password" required minlength="4" placeholder="至少4位"
                               class="w-full p-3 bg-zinc-50 rounded-xl text-sm font-medium">
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 font-semibold uppercase mb-1 block">确认密码</label>
                        <input type="password" id="password_confirm" required minlength="4" placeholder="再次输入密码"
                               class="w-full p-3 bg-zinc-50 rounded-xl text-sm font-medium">
                    </div>
                </div>

                <button type="submit" id="submit-btn"
                        class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold mt-6 hover:bg-indigo-700 transition-colors">
                    创建管理员账号
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ app_prefix }}/static/js/api.js?v=1.1.0"></script>
<script>
async function handleSetup(e) {
    e.preventDefault();
    const pwd = document.getElementById('password').value;
    const pwd2 = document.getElementById('password_confirm').value;
    if (pwd !== pwd2) {
        showToast('两次密码输入不一致');
        return;
    }
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '创建中...';
    try {
        await API.request('POST', '/api/auth/setup', {
            username: document.getElementById('username').value.trim(),
            display_name: document.getElementById('display_name').value.trim(),
            password: pwd
        });
        showToast('创建成功，正在跳转...', 'success');
        setTimeout(() => { window.location.href = '{{ app_prefix }}/app'; }, 500);
    } catch (err) {
        showToast(err.message);
        btn.disabled = false;
        btn.textContent = '创建管理员账号';
    }
}
</script>
{% endblock %}
