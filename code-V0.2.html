<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>家庭健身 - 精简优化版</title>
    <style>
        .modal-overlay { transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .type-btn { transition: all 0.2s; }
        .type-btn.active { background-color: #4f46e5; color: white; }

        /* ==================== 高级交互组件样式 ==================== */
        /* 侧滑动画 */
        .slide-panel { transition: transform 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94); }
        .slide-panel.active { transform: translateX(0); }
        
        /* 弹窗半透明遮罩与底部升起 */
        .custom-modal-mask { transition: opacity 0.25s ease; opacity: 0; pointer-events: none; }
        .custom-modal-mask.active { opacity: 1; pointer-events: auto; }
        .custom-modal-container { transition: transform 0.25s cubic-bezier(0.1, 0.76, 0.55, 0.94); transform: translateY(100%); }
        .custom-modal-mask.active .custom-modal-container { transform: translateY(0); }

        /* iOS 滚轮样式模拟 */
        .ios-picker-wrapper {
            position: relative;
            height: 160px;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, transparent 5%, white 35%, white 65%, transparent 95%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, transparent 5%, white 35%, white 65%, transparent 95%, transparent);
        }
        .ios-picker-column {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .ios-picker-column::-webkit-scrollbar { display: none; }
        .ios-picker-item {
            height: 40px;
            line-height: 40px;
            scroll-snap-align: center;
            transition: transform 0.1s;
        }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans">

    <div id="setup-modal" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center p-6 hidden">
        <h2 class="text-2xl font-bold mb-2">欢迎加入家庭健身</h2>
        <p class="text-slate-400 mb-8">请选择你的身份，方便家人识别</p>
        <div class="grid grid-cols-2 gap-4 w-full max-w-sm">
            <button onclick="saveIdentity('爸爸')" class="p-6 bg-blue-50 border border-blue-100 rounded-2xl text-lg font-bold">👨 爸爸</button>
            <button onclick="saveIdentity('妈妈')" class="p-6 bg-pink-50 border border-pink-100 rounded-2xl text-lg font-bold">👩 妈妈</button>
            <button onclick="saveIdentity('儿子')" class="p-6 bg-indigo-50 border border-indigo-100 rounded-2xl text-lg font-bold">👦 儿子</button>
        </div>
    </div>

    <div class="w-full max-w-[375px] h-[700px] bg-white rounded-[40px] shadow-2xl overflow-hidden flex flex-col border-[8px] border-white ring-1 ring-slate-200 relative">
        
        <div class="p-6 pb-2 bg-gradient-to-b from-slate-50 to-white">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-black text-slate-800">家庭健身</h1>
                <div id="user-badge" class="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs font-bold flex items-center gap-1"></div>
            </div>

            <div class="bg-slate-100/80 p-1 rounded-2xl flex mb-6">
                <button onclick="setViewMode('all')" id="btn-all" class="flex-1 py-2 rounded-xl text-xs font-semibold shadow-sm bg-white text-indigo-600 transition-all">动态</button>
                <button onclick="setViewMode('me')" id="btn-me" class="flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500 transition-all">我的</button>
                <button onclick="setViewMode('stats')" id="btn-stats" class="flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500 transition-all">统计</button>
            </div>

            <div class="flex justify-between items-center text-slate-600 mb-6">
                <button onclick="changeWeek(-1)" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                <div class="text-sm font-medium" id="week-display">本周 (4.20 - 4.26)</div>
                <button onclick="changeWeek(1)" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
            </div>
        </div>

        <div class="px-6 py-2 grid grid-cols-2 gap-3" id="summary-cards">
            <div class="bg-indigo-600 p-5 rounded-3xl text-white shadow-lg shadow-indigo-200">
                <div class="text-[10px] uppercase tracking-wider opacity-70 mb-1">总时长</div>
                <div class="text-2xl font-bold" id="stat-time">0 min</div>
            </div>
            <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                <div class="text-[10px] uppercase tracking-wider text-slate-400 mb-1">总里程/量</div>
                <div class="text-2xl font-bold text-slate-800" id="stat-dist">0</div>
            </div>
        </div>

        <!-- 历史记录列表 -->
        <div class="flex-1 overflow-y-auto px-6 py-6" id="record-list"></div>

        <div class="p-6">
            <button onclick="toggleModal(true)" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl shadow-slate-300 flex justify-center items-center gap-2 hover:scale-[1.02] transition-transform">
                <i data-lucide="plus" class="w-5 h-5"></i> 添加今日记录
            </button>
        </div>

        <!-- ==================== 核心记录新运动弹窗（高仿图片1） ==================== -->
        <div id="modal" class="absolute inset-0 bg-black/40 modal-overlay opacity-0 pointer-events-none z-50 flex items-end justify-center">
            <div class="bg-white w-full rounded-t-[32px] p-6 modal-content translate-y-full flex flex-col max-h-[90%]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800">添加运动记录</h2>
                    <button onclick="toggleModal(false)" class="p-1 hover:bg-slate-100 rounded-full"><i data-lucide="x"></i></button>
                </div>
                
                <div class="space-y-4 overflow-y-auto flex-1 pb-4">
                    <!-- 顶部的动态大运动徽标 -->
                    <div class="flex justify-center py-2">
                        <div id="form-big-icon" class="w-20 h-20 bg-indigo-600 text-white rounded-full flex items-center justify-center text-4xl shadow-md">🪢</div>
                    </div>

                    <!-- 列表式配置项 -->
                    <div class="bg-slate-50 rounded-2xl border border-slate-100 overflow-hidden divide-y divide-slate-200/60">
                        <!-- 运动类型：支持侧滑切换 -->
                        <div onclick="openTypePanel()" class="p-4 flex justify-between items-center active:bg-slate-100 cursor-pointer transition-colors">
                            <span class="text-slate-700 font-medium text-sm">运动类型</span>
                            <div class="flex items-center gap-1 text-slate-400">
                                <span id="val-type" class="text-slate-800 font-bold text-sm">跳绳</span>
                                <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </div>
                        </div>
                        <!-- 运动时长：支持iOS风格滚动弹窗 -->
                        <div onclick="openDurationModal()" class="p-4 flex justify-between items-center active:bg-slate-100 cursor-pointer transition-colors">
                            <span class="text-slate-700 font-medium text-sm">运动时长</span>
                            <div class="flex items-center gap-1 text-slate-400">
                                <span id="val-duration" class="text-slate-800 font-bold text-sm">00:10:00</span>
                                <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </div>
                        </div>
                        <!-- 次数/个数/距离：点击触发独立输入弹窗 -->
                        <div onclick="openCountModal()" class="p-4 flex justify-between items-center active:bg-slate-100 cursor-pointer transition-colors">
                            <span id="label-count" class="text-slate-700 font-medium text-sm">数量 (个)</span>
                            <div class="flex items-center gap-1 text-slate-400">
                                <span id="val-count" class="text-slate-800 font-bold text-sm">100 个</span>
                                <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="saveRecord()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold mt-4 shadow-lg shadow-indigo-100">确认保存</button>
                </div>
            </div>
        </div>

        <!-- ==================== 优化后：精简版运动类型侧滑选择面板（去掉了复杂的左侧栏） ==================== -->
        <div id="type-panel" class="absolute inset-0 bg-white z-[60] slide-panel translate-x-full flex flex-col">
            <div class="p-4 border-b flex items-center gap-2">
                <button onclick="closeTypePanel()" class="p-1 hover:bg-slate-100 rounded-full"><i data-lucide="chevron-left"></i></button>
                <span class="font-bold text-lg text-slate-800">选择运动</span>
            </div>
            <!-- 平铺式纯净网格 -->
            <div class="flex-1 p-6 overflow-y-auto">
                <div class="grid grid-cols-3 gap-y-8 gap-x-4 text-center">
                    <div onclick="selectType('跳绳','🪢')" class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl shadow-sm group-active:scale-95 transition-transform">🪢</div>
                        <span class="text-xs text-slate-700 font-semibold">跳绳</span>
                    </div>
                    <div onclick="selectType('引体向上','💪')" class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-14 h-14 bg-slate-50 text-slate-700 rounded-2xl flex items-center justify-center text-2xl shadow-sm group-active:scale-95 transition-transform">💪</div>
                        <span class="text-xs text-slate-700 font-semibold">引体向上</span>
                    </div>
                    <div onclick="selectType('拉伸','🧘')" class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-14 h-14 bg-slate-50 text-slate-700 rounded-2xl flex items-center justify-center text-2xl shadow-sm group-active:scale-95 transition-transform">🧘</div>
                        <span class="text-xs text-slate-700 font-semibold">拉伸</span>
                    </div>
                    <div onclick="selectType('跑步','🏃')" class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-14 h-14 bg-slate-50 text-slate-700 rounded-2xl flex items-center justify-center text-2xl shadow-sm group-active:scale-95 transition-transform">🏃</div>
                        <span class="text-xs text-slate-700 font-semibold">跑步</span>
                    </div>
                    <div onclick="selectType('壶铃','🏋️')" class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-14 h-14 bg-slate-50 text-slate-700 rounded-2xl flex items-center justify-center text-2xl shadow-sm group-active:scale-95 transition-transform">🏋️</div>
                        <span class="text-xs text-slate-700 font-semibold">壶铃</span>
                    </div>
                    <div onclick="selectType('游泳','🏊')" class="flex flex-col items-center gap-2 cursor-pointer group">
                        <div class="w-14 h-14 bg-slate-50 text-slate-700 rounded-2xl flex items-center justify-center text-2xl shadow-sm group-active:scale-95 transition-transform">🏊</div>
                        <span class="text-xs text-slate-700 font-semibold">游泳</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== iOS 风运动时长滚动弹窗 ==================== -->
        <div id="duration-modal" class="absolute inset-0 bg-black/40 z-[70] custom-modal-mask flex items-end justify-center">
            <div class="bg-white w-full rounded-t-[32px] p-6 custom-modal-container flex flex-col">
                <div class="text-center font-bold text-lg text-slate-800 mb-6">运动时长</div>
                <div class="ios-picker-wrapper grid grid-cols-3 bg-slate-50 rounded-2xl relative mb-6">
                    <div class="absolute inset-x-2 top-1/2 -translate-y-1/2 h-10 bg-slate-200/60 rounded-xl -z-10 pointer-events-none border-y border-slate-200"></div>
                    <!-- 时 -->
                    <div class="ios-picker-column text-center" id="picker-hour"></div>
                    <!-- 分 -->
                    <div class="ios-picker-column text-center" id="picker-minute"></div>
                    <!-- 秒 -->
                    <div class="ios-picker-column text-center" id="picker-second"></div>
                </div>
                <div class="grid grid-cols-2 border-t pt-4 text-center text-sm">
                    <button onclick="closeDurationModal()" class="text-slate-500 font-medium py-2">取消</button>
                    <button onclick="confirmDuration()" class="text-indigo-600 font-bold py-2 border-l">确定</button>
                </div>
            </div>
        </div>

        <!-- ==================== 数量/距离独立弹窗 ==================== -->
        <div id="count-modal" class="absolute inset-0 bg-black/40 z-[70] custom-modal-mask flex items-end justify-center">
            <div class="bg-white w-full rounded-t-[32px] p-6 custom-modal-container">
                <div id="count-modal-title" class="text-center font-bold text-lg text-slate-800 mb-4">输入数量</div>
                <div class="flex bg-slate-100 rounded-2xl p-3 items-center mb-6">
                    <input type="number" id="count-input" step="1" class="bg-transparent text-center text-2xl font-black text-slate-800 w-full focus:outline-none">
                    <span id="count-modal-unit" class="text-slate-400 font-bold pr-2">个</span>
                </div>
                <div class="grid grid-cols-2 border-t pt-4 text-center text-sm">
                    <button onclick="closeCountModal()" class="text-slate-500 font-medium py-2">取消</button>
                    <button onclick="confirmCount()" class="text-indigo-600 font-bold py-2 border-l">确定</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 完全保留原系统底层状态及核心数据结构与初始化逻辑
        let state = { 
            viewMode: 'all', 
            currentWeek: 0, 
            selectedType: '跳绳', // 默认推荐第一个核心运动
            selectedDurationMin: 10, 
            selectedCount: 100,
            selectedIcon: '🪢',
            records: JSON.parse(localStorage.getItem('fitnessRecords') || '[{"id":1,"name":"爸爸","user":"爸爸","type":"跳绳","duration":10,"dist":150,"time":"15:30","week":0}]')
        };

        // 按项目配置计数单位（其他默认 km）
        const countBasedTypes = ['拉伸', '跳绳', '引体向上'];
        const typeIcons = { '跳绳':'🪢', '引体向上':'💪', '拉伸':'🧘', '跑步':'🏃', '壶铃':'🏋️', '游泳':'🏊' };

        window.onload = function() {
            const role = localStorage.getItem('myRole');
            if (!role) {
                document.getElementById('setup-modal').classList.remove('hidden');
            } else {
                window.myCurrentRole = role;
                updateUserBadge();
            }
            lucide.createIcons();
            initPickers(); 
            render();
        };

        function updateUserBadge() {
            const badge = document.getElementById('user-badge');
            const icon = window.myCurrentRole === '爸爸' ? '👨' : (window.myCurrentRole === '妈妈' ? '👩' : '👦');
            badge.innerHTML = `${icon} ${window.myCurrentRole}`;
        }

        function saveIdentity(role) {
            localStorage.setItem('myRole', role);
            window.myCurrentRole = role;
            updateUserBadge();
            document.getElementById('setup-modal').classList.add('hidden');
        }

        function toggleModal(show) {
            const modal = document.getElementById('modal');
            const content = modal.querySelector('.modal-content');
            if (show) {
                modal.classList.remove('pointer-events-none', 'opacity-0');
                modal.classList.add('opacity-100');
                content.classList.remove('translate-y-full');
                selectType(state.selectedType);
            } else {
                modal.classList.add('opacity-0');
                modal.classList.remove('opacity-100');
                content.classList.add('translate-y-full');
                setTimeout(() => modal.classList.add('pointer-events-none'), 300);
            }
        }

        function openTypePanel() { document.getElementById('type-panel').classList.add('active'); }
        function closeTypePanel() { document.getElementById('type-panel').classList.remove('active'); }
        
        function selectType(type) {
            state.selectedType = type;
            state.selectedIcon = typeIcons[type] || '🪢';
            
            document.getElementById('val-type').innerText = type;
            document.getElementById('form-big-icon').innerText = state.selectedIcon;
            
            const isCount = countBasedTypes.includes(type);
            document.getElementById('label-count').innerText = isCount ? "数量 (个)" : "距离 (km)";
            
            // 智能化转换默认填充值，防止跨度过大
            if(isCount && state.selectedCount === 3.0) state.selectedCount = 100;
            if(!isCount && state.selectedCount === 100) state.selectedCount = 3.0;
            
            document.getElementById('val-count').innerText = `${state.selectedCount} ${isCount ? '个' : 'km'}`;
            closeTypePanel();
        }

        function openCountModal() {
            const isCount = countBasedTypes.includes(state.selectedType);
            document.getElementById('count-modal-title').innerText = isCount ? "输入数量" : "输入距离";
            document.getElementById('count-modal-unit').innerText = isCount ? "个" : "km";
            document.getElementById('count-input').value = state.selectedCount;
            document.getElementById('count-modal').classList.add('active');
        }
        function closeCountModal() { document.getElementById('count-modal').classList.remove('active'); }
        function confirmCount() {
            state.selectedCount = parseFloat(document.getElementById('count-input').value || 0);
            const isCount = countBasedTypes.includes(state.selectedType);
            document.getElementById('val-count').innerText = `${state.selectedCount} ${isCount ? '个' : 'km'}`;
            closeCountModal();
        }

        function openDurationModal() {
            document.getElementById('duration-modal').classList.add('active');
            const totalSeconds = state.selectedDurationMin * 60;
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            scrollToValue('picker-hour', h);
            scrollToValue('picker-minute', m);
            scrollToValue('picker-second', s);
        }
        function closeDurationModal() { document.getElementById('duration-modal').classList.remove('active'); }
        
        function confirmDuration() {
            const h = parseInt(getPickerValue('picker-hour'));
            const m = parseInt(getPickerValue('picker-minute'));
            const s = parseInt(getPickerValue('picker-second'));
            
            document.getElementById('val-duration').innerText = 
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            
            state.selectedDurationMin = Math.round((h * 3600 + m * 60 + s) / 60) || 1;
            closeDurationModal();
        }

        function initPickers() {
            fillPickerHTML('picker-hour', 24);
            fillPickerHTML('picker-minute', 60);
            fillPickerHTML('picker-second', 60);
        }

        function fillPickerHTML(id, count) {
            const col = document.getElementById(id);
            let html = `<div class="ios-picker-item text-transparent"></div><div class="ios-picker-item text-transparent"></div>`;
            for(let i=0; i<count; i++) {
                const str = i.toString().padStart(2, '0');
                html += `<div class="ios-picker-item text-slate-700 font-bold text-sm" data-val="${str}">${str}</div>`;
            }
            html += `<div class="ios-picker-item text-transparent"></div><div class="ios-picker-item text-transparent"></div>`;
            col.innerHTML = html;
        }

        function scrollToValue(id, val) {
            const col = document.getElementById(id);
            setTimeout(() => { col.scrollTop = val * 40; }, 50);
        }

        function getPickerValue(id) {
            const col = document.getElementById(id);
            const index = Math.round(col.scrollTop / 40);
            const items = col.querySelectorAll('[data-val]');
            if(items[index]) return items[index].getAttribute('data-val');
            return '00';
        }

        function saveRecord() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            state.records.unshift({
                id: Date.now(), 
                name: window.myCurrentRole || "游客", 
                user: window.myCurrentRole || "游客", 
                type: state.selectedType, 
                duration: state.selectedDurationMin, 
                dist: state.selectedCount, 
                time: timeStr,
                week: 0
            });
            localStorage.setItem('fitnessRecords', JSON.stringify(state.records));
            render();
            toggleModal(false);
        }

        function render() {
            const summaryCards = document.getElementById('summary-cards');
            const recordList = document.getElementById('record-list');
            
            let filtered = state.records.filter(r => r.week === state.currentWeek);

            if (state.viewMode === 'stats') {
                summaryCards.classList.add('hidden');
                const stats = {};
                filtered.forEach(r => {
                    if (!stats[r.user]) stats[r.user] = { duration: 0, dists: [] };
                    stats[r.user].duration += r.duration;
                    stats[r.user].dists.push({ type: r.type, val: r.dist });
                });

                recordList.innerHTML = `<h3 class="text-sm font-bold text-slate-400 mb-4">成员运动统计</h3>` + Object.keys(stats).map(user => {
                    const totalDur = stats[user].duration;
                    return `
                        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm mb-4">
                            <div class="flex items-center gap-3 mb-3">
                                <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold">${user[0]}</div>
                                <div class="font-bold text-slate-800">${user}</div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-center">
                                <div class="bg-slate-50 p-3 rounded-xl"><div class="text-xs text-slate-400">总时长</div><div class="font-bold">${totalDur} min</div></div>
                                <div class="bg-slate-50 p-3 rounded-xl"><div class="text-xs text-slate-400">记录数</div><div class="font-bold">${stats[user].dists.length} 次</div></div>
                            </div>
                        </div>
                    `;
                }).join('');

            } else {
                summaryCards.classList.remove('hidden');
                let displayRecords = state.viewMode === 'all' ? filtered : filtered.filter(r => r.user === window.myCurrentRole);
                
                document.getElementById('stat-time').innerText = displayRecords.reduce((s, r) => s + r.duration, 0) + " min";
                document.getElementById('stat-dist').innerText = displayRecords.filter(r => !countBasedTypes.includes(r.type)).reduce((s, r) => s + r.dist, 0).toFixed(1);

                recordList.innerHTML = displayRecords.map(r => {
                    const unit = countBasedTypes.includes(r.type) ? "个" : "km";
                    const currentIcon = typeIcons[r.type] || '🏋️';
                    return `
                        <div class="mb-4 bg-white p-5 rounded-2xl border border-slate-100 flex items-center justify-between shadow-sm">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">${currentIcon}</div>
                                <div>
                                    <div class="text-sm font-bold text-slate-800">${r.type}</div>
                                    <div class="text-xs text-slate-400">${r.name} · ${r.time}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-bold text-slate-800">${r.duration} min</div>
                                <div class="text-xs text-slate-400">${r.dist} ${unit}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function setViewMode(mode) {
            state.viewMode = mode;
            document.getElementById('btn-all').className = mode === 'all' ? "flex-1 py-2 rounded-xl text-xs font-semibold shadow-sm bg-white text-indigo-600" : "flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500";
            document.getElementById('btn-me').className = mode === 'me' ? "flex-1 py-2 rounded-xl text-xs font-semibold shadow-sm bg-white text-indigo-600" : "flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500";
            document.getElementById('btn-stats').className = mode === 'stats' ? "flex-1 py-2 rounded-xl text-xs font-semibold shadow-sm bg-white text-indigo-600" : "flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500";
            render();
        }

        function changeWeek(delta) {
            state.currentWeek += delta;
            document.getElementById('week-display').innerText = state.currentWeek === 0 ? "本周 (4.20 - 4.26)" : "上周 (4.13 - 4.19)";
            render();
        }
    </script>
</body>
</html>
