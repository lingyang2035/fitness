<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>家庭健身 - 完整版</title>
    <style>
        .modal-overlay { transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .type-btn { transition: all 0.2s; }
        .type-btn.active { background-color: #4f46e5; color: white; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans">

    <div id="setup-modal" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center p-6 hidden">
        <h2 class="text-2xl font-bold mb-2">欢迎加入家庭健身</h2>
        <p class="text-slate-400 mb-8">请选择你的身份，方便家人识别</p>
        <div class="grid grid-cols-2 gap-4 w-full max-w-sm">
            <button onclick="saveIdentity('爸爸')" class="p-6 bg-blue-50 border border-blue-100 rounded-2xl text-lg font-bold">👨 爸爸</button>
            <button onclick="saveIdentity('妈妈')" class="p-6 bg-pink-50 border border-pink-100 rounded-2xl text-lg font-bold">👩 妈妈</button>
            <button onclick="saveIdentity('儿子')" class="p-6 bg-indigo-50 border border-indigo-100 rounded-2xl text-lg font-bold">👦 儿子</button>
        </div>
    </div>

    <div class="w-full max-w-[375px] h-[700px] bg-white rounded-[40px] shadow-2xl overflow-hidden flex flex-col border-[8px] border-white ring-1 ring-slate-200 relative">
        
        <div class="p-6 pb-2 bg-gradient-to-b from-slate-50 to-white">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-black text-slate-800">家庭健身</h1>
                <div id="user-badge" class="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs font-bold flex items-center gap-1"></div>
            </div>

            <div class="bg-slate-100/80 p-1 rounded-2xl flex mb-6">
                <button onclick="setViewMode('all')" id="btn-all" class="flex-1 py-2 rounded-xl text-xs font-semibold shadow-sm bg-white text-indigo-600 transition-all">动态</button>
                <button onclick="setViewMode('me')" id="btn-me" class="flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500 transition-all">我的</button>
                <button onclick="setViewMode('stats')" id="btn-stats" class="flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500 transition-all">统计</button>
            </div>

            <div class="flex justify-between items-center text-slate-600 mb-6">
                <button onclick="changeWeek(-1)" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                <div class="text-sm font-medium" id="week-display">本周 (4.20 - 4.26)</div>
                <button onclick="changeWeek(1)" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
            </div>
        </div>

        <div class="px-6 py-2 grid grid-cols-2 gap-3" id="summary-cards">
            <div class="bg-indigo-600 p-5 rounded-3xl text-white shadow-lg shadow-indigo-200">
                <div class="text-[10px] uppercase tracking-wider opacity-70 mb-1">总时长</div>
                <div class="text-2xl font-bold" id="stat-time">0 min</div>
            </div>
            <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                <div class="text-[10px] uppercase tracking-wider text-slate-400 mb-1">总里程/量</div>
                <div class="text-2xl font-bold text-slate-800" id="stat-dist">0</div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto px-6 py-6" id="record-list"></div>

        <div class="p-6">
            <button onclick="toggleModal(true)" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl shadow-slate-300 flex justify-center items-center gap-2 hover:scale-[1.02] transition-transform">
                <i data-lucide="plus" class="w-5 h-5"></i> 添加今日记录
            </button>
        </div>

        <div id="modal" class="absolute inset-0 bg-black/40 modal-overlay opacity-0 pointer-events-none z-50 flex items-end justify-center">
            <div class="bg-white w-full rounded-t-[32px] p-6 modal-content translate-y-full">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-slate-800">记录新运动</h2>
                    <button onclick="toggleModal(false)" class="p-1 hover:bg-slate-100 rounded-full"><i data-lucide="x"></i></button>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-slate-400 font-semibold uppercase mb-2 block">运动类型</label>
                        <div class="grid grid-cols-3 gap-2" id="type-selector">
                            <button onclick="selectType('跑步', this)" class="type-btn active py-2 bg-slate-100 rounded-xl text-xs font-bold">跑步</button>
                            <button onclick="selectType('壶铃', this)" class="type-btn py-2 bg-slate-100 rounded-xl text-xs font-bold">壶铃</button>
                            <button onclick="selectType('拉伸', this)" class="type-btn py-2 bg-slate-100 rounded-xl text-xs font-bold">拉伸</button>
                            <button onclick="selectType('跳绳', this)" class="type-btn py-2 bg-slate-100 rounded-xl text-xs font-bold">跳绳</button>
                            <button onclick="selectType('游泳', this)" class="type-btn py-2 bg-slate-100 rounded-xl text-xs font-bold">游泳</button>
                            <button onclick="selectType('引体向上', this)" class="type-btn py-2 bg-slate-100 rounded-xl text-xs font-bold">引体向上</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-slate-400 font-semibold uppercase">时长 (min)</label>
                            <input type="number" id="input-dur" value="30" class="w-full mt-2 p-3 bg-slate-50 rounded-xl font-bold">
                        </div>
                        <div>
                            <label id="dist-label" class="text-xs text-slate-400 font-semibold uppercase">距离 (km)</label>
                            <input type="number" id="input-dist" value="3.0" step="0.1" class="w-full mt-2 p-3 bg-slate-50 rounded-xl font-bold">
                        </div>
                    </div>
                    <button onclick="saveRecord()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold mt-4">确认保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = { 
            viewMode: 'all', 
            currentWeek: 0, 
            selectedType: '跑步',
            records: JSON.parse(localStorage.getItem('fitnessRecords') || '[{"id":1,"name":"爸爸","user":"爸爸","type":"跑步","duration":40,"dist":5.2,"time":"15:30","week":0}]')
        };

        const countBasedTypes = ['拉伸', '跳绳', '引体向上'];

        window.onload = function() {
            const role = localStorage.getItem('myRole');
            if (!role) {
                document.getElementById('setup-modal').classList.remove('hidden');
            } else {
                window.myCurrentRole = role;
                updateUserBadge();
            }
            lucide.createIcons();
            render();
        };

        function updateUserBadge() {
            const badge = document.getElementById('user-badge');
            const icon = window.myCurrentRole === '爸爸' ? '👨' : (window.myCurrentRole === '妈妈' ? '👩' : '👦');
            badge.innerHTML = `${icon} ${window.myCurrentRole}`;
        }

        function saveIdentity(role) {
            localStorage.setItem('myRole', role);
            window.myCurrentRole = role;
            updateUserBadge();
            document.getElementById('setup-modal').classList.add('hidden');
        }

        function selectType(type, btn) {
            state.selectedType = type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const label = document.getElementById('dist-label');
            label.innerText = countBasedTypes.includes(type) ? "数量 (个)" : "距离 (km)";
        }

        function toggleModal(show) {
            const modal = document.getElementById('modal');
            const content = modal.querySelector('.modal-content');
            if (show) {
                modal.classList.remove('pointer-events-none', 'opacity-0');
                modal.classList.add('opacity-100');
                content.classList.remove('translate-y-full');
            } else {
                modal.classList.add('opacity-0');
                modal.classList.remove('opacity-100');
                content.classList.add('translate-y-full');
                setTimeout(() => modal.classList.add('pointer-events-none'), 300);
            }
        }

        function saveRecord() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            state.records.unshift({
                id: Date.now(), 
                name: window.myCurrentRole || "游客", 
                user: window.myCurrentRole || "游客", 
                type: state.selectedType, 
                duration: parseInt(document.getElementById('input-dur').value) || 0, 
                dist: parseFloat(document.getElementById('input-dist').value) || 0, 
                time: timeStr,
                week: 0
            });
            localStorage.setItem('fitnessRecords', JSON.stringify(state.records));
            render();
            toggleModal(false);
        }

        function render() {
            const summaryCards = document.getElementById('summary-cards');
            const recordList = document.getElementById('record-list');
            
            // 基础筛选
            let filtered = state.records.filter(r => r.week === state.currentWeek);

            if (state.viewMode === 'stats') {
                summaryCards.classList.add('hidden');
                // 按人聚合数据
                const stats = {};
                filtered.forEach(r => {
                    if (!stats[r.user]) stats[r.user] = { duration: 0, dists: [] };
                    stats[r.user].duration += r.duration;
                    stats[r.user].dists.push({ type: r.type, val: r.dist });
                });

                recordList.innerHTML = `<h3 class="text-sm font-bold text-slate-400 mb-4">成员运动统计</h3>` + Object.keys(stats).map(user => {
                    const totalDur = stats[user].duration;
                    return `
                        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm mb-4">
                            <div class="flex items-center gap-3 mb-3">
                                <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold">${user[0]}</div>
                                <div class="font-bold text-slate-800">${user}</div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-center">
                                <div class="bg-slate-50 p-3 rounded-xl"><div class="text-xs text-slate-400">总时长</div><div class="font-bold">${totalDur} min</div></div>
                                <div class="bg-slate-50 p-3 rounded-xl"><div class="text-xs text-slate-400">记录数</div><div class="font-bold">${stats[user].dists.length} 次</div></div>
                            </div>
                        </div>
                    `;
                }).join('');

            } else {
                summaryCards.classList.remove('hidden');
                let displayRecords = state.viewMode === 'all' ? filtered : filtered.filter(r => r.user === window.myCurrentRole);
                
                document.getElementById('stat-time').innerText = displayRecords.reduce((s, r) => s + r.duration, 0) + " min";
                document.getElementById('stat-dist').innerText = displayRecords.filter(r => !countBasedTypes.includes(r.type)).reduce((s, r) => s + r.dist, 0).toFixed(1);

                recordList.innerHTML = displayRecords.map(r => {
                    const unit = countBasedTypes.includes(r.type) ? "个" : "km";
                    return `
                        <div class="mb-4 bg-white p-5 rounded-2xl border border-slate-100 flex items-center justify-between shadow-sm">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center font-bold">${r.name[0]}</div>
                                <div>
                                    <div class="text-sm font-bold text-slate-800">${r.type}</div>
                                    <div class="text-xs text-slate-400">${r.name} · ${r.time}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-bold text-slate-800">${r.duration} min</div>
                                <div class="text-xs text-slate-400">${r.dist} ${unit}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function setViewMode(mode) {
            state.viewMode = mode;
            document.getElementById('btn-all').className = mode === 'all' ? "flex-1 py-2 rounded-xl text-xs font-semibold shadow-sm bg-white text-indigo-600" : "flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500";
            document.getElementById('btn-me').className = mode === 'me' ? "flex-1 py-2 rounded-xl text-xs font-semibold shadow-sm bg-white text-indigo-600" : "flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500";
            document.getElementById('btn-stats').className = mode === 'stats' ? "flex-1 py-2 rounded-xl text-xs font-semibold shadow-sm bg-white text-indigo-600" : "flex-1 py-2 rounded-xl text-xs font-semibold text-slate-500";
            render();
        }

        function changeWeek(delta) {
            state.currentWeek += delta;
            document.getElementById('week-display').innerText = state.currentWeek === 0 ? "本周 (4.20-4.26)" : "上周 (4.13-4.19)";
            render();
        }
    </script>
</body>
</html>
